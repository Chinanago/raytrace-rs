[package]
name = "raytrace-io"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Optical projects, persistence and result exports"
readme = "../../README.md"
keywords = ["optics", "raytracing"]
categories = ["science", "simulation"]

[features]
default = []
png = ["dep:image"]
# JSON Schema generation for model and report types.
schema = ["dep:schemars", "raytrace-core/schema", "raytrace-formats/schema"]

[dependencies]
thiserror = { workspace = true }
rayon = { workspace = true }
raytrace-core = { workspace = true }
raytrace-formats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[lints]
workspace = true
