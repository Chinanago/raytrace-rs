[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "all"
yanked = "warn"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "OFL-1.1"]
confidence-threshold = 0.9

# egui's bundled Ubuntu font is distributed under the Ubuntu Font License.
# Keep this permission scoped to the font package; its UFL.txt is shipped in the ZIP.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
