name: Release assets

# Attaches the static Linux CLI to a published release. Release notes and the
# Windows ZIP stay as they are; reruns replace the Linux files.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.12.0
        required: true

permissions:
  contents: read

jobs:
  linux-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install Rust tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target x86_64-unknown-linux-musl
          rustup default 1.95.0
      - name: Build and smoke-test the static Linux CLI
        run: python3 scripts/package_linux.py
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the workspace version $version" >&2
            exit 1
          fi
          versioned="results/packages/raytrace-rs-$version-linux-x64.tar.gz"
          # A fixed name lets agents download releases/latest/download/raytrace-rs-linux-x64.tar.gz.
          cp "$versioned" results/packages/raytrace-rs-linux-x64.tar.gz
          gh release upload "$TAG" "$versioned" results/packages/raytrace-rs-linux-x64.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
