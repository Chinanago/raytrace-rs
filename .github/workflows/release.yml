name: Release assets

# Builds the distributable files for a published release and attaches them. Each file is
# uploaded twice: with the version in its name and under a fixed name, so that
# https://github.com/Chinanago/raytrace-rs/releases/latest/download/<fixed name> always
# resolves to the newest release. Every file also gets a `<file>.sha256` next to it
# (`<hex>  <filename>`), which install.sh and install.ps1 verify. Reruns replace the files.
#
# Run by hand with a tag name, it first publishes the release (title and notes from the
# version's CHANGELOG.md section) when there is none, creating the tag on the chosen ref if
# needed. A release that already exists is left as it is.
#
#   raytrace-rs-<version>-windows-x64.zip   raytrace-rs-windows-x64.zip
#   raytrace-rs-<version>-windows.mcpb      raytrace-rs-windows.mcpb
#   raytrace-rs-<version>-macos.tar.gz      raytrace-rs-macos.tar.gz
#   raytrace-rs-<version>-macos.mcpb        raytrace-rs-macos.mcpb
#   raytrace-rs-<version>-linux-x64.tar.gz  raytrace-rs-linux-x64.tar.gz
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.12.0 (a missing tag and release are created on the chosen ref)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The commit the run was started from: the tag's commit for a published release, the
      # chosen branch or tag for a manual run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Publish the release when the tag has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the workspace version $version" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          awk -v v="$version" '
            index($0, "## " v) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          heading=$(grep -m1 "^## $version" CHANGELOG.md | sed 's/^## //')
          # A missing tag is created on the run's commit; an existing one must point at it.
          # On a missing tag gh prints the error JSON to stdout and fails, so keep only a success.
          if ! tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha 2>/dev/null); then
            tagged=""
          fi
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG points at $tagged, not at $GITHUB_SHA; run the workflow from the tag" >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "raytrace-rs $heading" --notes-file notes.md

  windows:
    needs: release
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check that the tag matches the workspace version
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the workspace version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install Rust tools
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Build Windows binaries
        shell: pwsh
        run: cargo build --release --locked --workspace --bins
      - name: Build and check the portable ZIP
        shell: pwsh
        run: |
          python scripts/package_windows.py --no-build
          python scripts/check_portable.py "results/packages/raytrace-rs-$env:VERSION-windows-x64.zip"
      - name: Build the Claude Desktop extension
        shell: pwsh
        run: python scripts/package_mcpb.py windows target/release/raytrace-rs.exe results/packages --check-server
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd results/packages
          cp "raytrace-rs-$VERSION-windows-x64.zip" raytrace-rs-windows-x64.zip
          cp "raytrace-rs-$VERSION-windows.mcpb" raytrace-rs-windows.mcpb
          assets=("raytrace-rs-$VERSION-windows-x64.zip" raytrace-rs-windows-x64.zip \
            "raytrace-rs-$VERSION-windows.mcpb" raytrace-rs-windows.mcpb)
          upload=()
          for f in "${assets[@]}"; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$f" > "$f.sha256"
            upload+=("$f" "$f.sha256")
          done
          gh release upload "$TAG" "${upload[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    needs: release
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check that the tag matches the workspace version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the workspace version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install Rust tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default 1.95.0
      - name: Build, package and smoke-test the universal archive
        run: python3 scripts/package_macos.py
      - name: Build the Claude Desktop extension
        run: python3 scripts/package_mcpb.py macos target/universal-apple-darwin/release/raytrace-rs results/packages --check-server
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd results/packages
          cp "raytrace-rs-$VERSION-macos.tar.gz" raytrace-rs-macos.tar.gz
          cp "raytrace-rs-$VERSION-macos.mcpb" raytrace-rs-macos.mcpb
          assets=("raytrace-rs-$VERSION-macos.tar.gz" raytrace-rs-macos.tar.gz \
            "raytrace-rs-$VERSION-macos.mcpb" raytrace-rs-macos.mcpb)
          upload=()
          for f in "${assets[@]}"; do
            printf '%s  %s\n' "$(shasum -a 256 "$f" | cut -d' ' -f1)" "$f" > "$f.sha256"
            upload+=("$f" "$f.sha256")
          done
          gh release upload "$TAG" "${upload[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  linux:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Check that the tag matches the workspace version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the workspace version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install Rust tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target x86_64-unknown-linux-musl
          rustup default 1.95.0
      - name: Build and smoke-test the static Linux CLI
        run: python3 scripts/package_linux.py
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd results/packages
          cp "raytrace-rs-$VERSION-linux-x64.tar.gz" raytrace-rs-linux-x64.tar.gz
          assets=("raytrace-rs-$VERSION-linux-x64.tar.gz" raytrace-rs-linux-x64.tar.gz)
          upload=()
          for f in "${assets[@]}"; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$f" > "$f.sha256"
            upload+=("$f" "$f.sha256")
          done
          gh release upload "$TAG" "${upload[@]}" --clobber --repo "$GITHUB_REPOSITORY"
