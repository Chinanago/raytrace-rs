name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install Rust tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
      - name: Check publication contents
        run: python scripts/check_publish.py
      - name: Check dependencies
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --workspace check
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check code
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - name: Run all tests
        run: cargo test --locked --workspace --all-features
      - name: Check CLI-only build
        run: cargo check --locked -p raytrace-cli
      - name: Verify analytic and native roundtrip cases
        run: cargo run --release --locked --example validation_suite -- results/validation
      - name: Build Windows binaries
        run: cargo build --release --locked --workspace --bins
      - name: Build distribution
        run: python scripts/package_windows.py --no-build
      - name: Check portable distribution
        run: |
          $package = Get-ChildItem -LiteralPath results/packages -Filter '*.zip' | Select-Object -First 1
          python scripts/check_portable.py $package.FullName
      # install.ps1 in PowerShell 7 (pwsh) and Windows PowerShell 5.1 (powershell); the user PATH is restored.
      - name: Check the install script
        run: |
          $package = Get-ChildItem -LiteralPath results/packages -Filter '*.zip' | Select-Object -First 1
          python scripts/check_install.py $package.FullName
      - name: Build the Claude Desktop extension
        run: python scripts/package_mcpb.py windows target/release/raytrace-rs.exe results/packages --check-server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-${{ github.sha }}
          path: |
            results/packages/*.zip
            results/packages/*.mcpb
            results/validation/suite.json
            results/portable_summary.json
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install Rust tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default 1.95.0
      # The GUI tests build egui contexts without a window, so no display is needed.
      - name: Run all tests
        run: cargo test --locked --workspace --all-features
      - name: Build, package and smoke-test the universal macOS archive
        run: python3 scripts/package_macos.py
      - name: Check the install script
        run: python3 scripts/check_install.py results/packages/raytrace-rs-*-macos.tar.gz
      - name: Build the Claude Desktop extension
        run: python3 scripts/package_mcpb.py macos target/universal-apple-darwin/release/raytrace-rs results/packages --check-server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-${{ github.sha }}
          path: |
            results/packages/*.tar.gz
            results/packages/*.mcpb
          if-no-files-found: error
          retention-days: 14

  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
      - name: Check dependencies
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --workspace check
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check layers and core purity
        run: cargo xtask layers
      - name: Check the WebAssembly build of L0-L4
        run: |
          rustup target add wasm32-unknown-unknown
          cargo xtask wasm
      - name: Check code
        run: cargo clippy --locked -p raytrace-core -p raytrace-formats -p raytrace-doc -p raytrace-io -p raytrace-engine -p raytrace-mcp -p raytrace-cli -p raytrace-rs -p xtask --all-features --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked -p raytrace-core -p raytrace-formats -p raytrace-doc -p raytrace-io -p raytrace-engine -p raytrace-mcp -p raytrace-cli -p raytrace-rs -p xtask --all-features
      - name: Build and smoke-test the static Linux CLI
        run: |
          rustup target add x86_64-unknown-linux-musl
          python3 scripts/package_linux.py
      - name: Check the install script
        run: |
          shellcheck --severity=warning install.sh
          python3 scripts/check_install.py results/packages/raytrace-rs-*-linux-x64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-cli-${{ github.sha }}
          path: results/packages/*.tar.gz
          if-no-files-found: error
          retention-days: 14
